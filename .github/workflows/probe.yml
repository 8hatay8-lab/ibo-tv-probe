name: probe
on: [push, workflow_dispatch]
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env: {U: "${{ secrets.IPTV_U }}", P: "${{ secrets.IPTV_P }}"}
        run: |
          curl -s -m 20 -A "IBO-TV/1.0" -o o.json -w "code %{http_code}\n" "http://fx.mertnet.in/player_api.php?username=$U&password=$P" || true
          python3 -c "import json;d=json.load(open('o.json'))['user_info'];print({k:d.get(k) for k in ['auth','status','max_connections','active_cons','exp_date']})" || head -c 200 o.json
          curl -s -m 20 -A node -o o2.json -w "nodeUA %{http_code}\n" "http://fx.mertnet.in/player_api.php?username=$U&password=$P" || true
